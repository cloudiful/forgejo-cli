name: PR Template
about: Template for pull requests in this fork.
body:
  - type: textarea
    attributes:
      label: Changes Made
      description: Describe what changed and why.
  - type: textarea
    attributes:
      label: Tests
      description: Commands run and results observed.
  - type: checkboxes
    attributes:
      label: Fork contribution policy
      description: This policy applies only to cloudiful/forgejo-cli, not upstream. AI-assisted work is accepted with disclosure and human review.
      options:
        - label: I describe the change and tests above.
          required: true
        - label: Any AI-assisted work is disclosed and human-reviewed.
          required: true
